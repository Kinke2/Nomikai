<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>飲み会ゲーム集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#14151A;
    --bg-surface:#1D1F26;
    --bg-raised:#262933;
    --line:#33363F;
    --text:#F3F1EA;
    --text-muted:#9497A6;
    --radius-card:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-base);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:26px 18px 40px;
  }
  .brand{font-family:'Hachi Maru Pop', cursive;font-size:30px;color:var(--text);line-height:1.3;}
  .brand span{ -webkit-text-fill-color: initial; }
  .tagline{color:var(--text-muted);font-size:13.5px;margin-top:6px;line-height:1.6;}

  .game-list{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
  .game-card{
    display:flex;align-items:center;gap:14px;
    background:var(--bg-surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s, background .15s, transform .1s;
  }
  .game-card:active{transform:scale(.98);background:var(--bg-raised);}
  .game-icon{
    width:52px;height:52px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  .game-info{flex:1;min-width:0;}
  .game-title{font-weight:900;font-size:16px;}
  .game-tagline{color:var(--text-muted);font-size:12.5px;margin-top:4px;line-height:1.5;}
  .game-chevron{color:var(--text-muted);font-size:20px;flex-shrink:0;}

  .empty-note{
    margin-top:26px;color:var(--text-muted);font-size:13px;
    background:var(--bg-surface);border:1px dashed var(--line);border-radius:var(--radius-card);
    padding:16px;line-height:1.7;
  }

  .footer-note{margin-top:30px;color:var(--text-muted);font-size:11.5px;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div id="app">
  <div class="brand">🍻 飲み会ゲーム集</div>
  <div class="tagline">遊びたいゲームをタップしてね。</div>

  <div class="game-list" id="gameList"></div>
  <div class="empty-note" id="emptyNote" style="display:none;">
    まだゲームが登録されていません。games.js にゲームを追加してください。
  </div>

  <div class="footer-note">新しいゲームは games.js に追記するだけで、ここに自動で並びます。</div>
</div>

<script src="games.js"></script>
<script>
(function(){
  function hexToRgba(hex, alpha){
    var h = hex.replace('#','');
    var r = parseInt(h.substring(0,2),16);
    var g = parseInt(h.substring(2,4),16);
    var b = parseInt(h.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+alpha+')';
  }

  var games = (window.GAMES || []);
  var list = document.getElementById('gameList');

  if(games.length === 0){
    document.getElementById('emptyNote').style.display = 'block';
    return;
  }

  games.forEach(function(g){
    var a = document.createElement('a');
    a.className = 'game-card';
    a.href = g.file;

    var icon = document.createElement('div');
    icon.className = 'game-icon';
    icon.textContent = g.emoji || '🎮';
    icon.style.background = hexToRgba(g.accent || '#E8C24A', 0.16);
    icon.style.color = g.accent || '#E8C24A';

    var info = document.createElement('div');
    info.className = 'game-info';
    var title = document.createElement('div');
    title.className = 'game-title';
    title.textContent = g.title;
    var tag = document.createElement('div');
    tag.className = 'game-tagline';
    tag.textContent = g.tagline || '';
    info.appendChild(title);
    info.appendChild(tag);

    var chevron = document.createElement('div');
    chevron.className = 'game-chevron';
    chevron.textContent = '›';

    a.appendChild(icon);
    a.appendChild(info);
    a.appendChild(chevron);
    list.appendChild(a);
  });
})();
</script>
</body>
</html>
