<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>オンライン ロビー - 飲み会ゲーム集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  飲み会ゲーム集 オンライン ロビー(開発中)
  QRコードで1度だけ部屋に参加し、ロビーからゲームを選ぶ。ロビーに戻れば同じ部屋のまま別のゲームを選べる。
  各ゲーム: g-wolf.js(ワードウルフ) / g-lupi.js(最小ユニーク) / g-shimei.js(秘密指名ゲーム) / g-kankaku.js(感覚ならべ) / g-gaman.js(我慢くらべ入札) / g-chicken.js(チキンレース) / g-indian.js(インディアンポーカー) / g-onenight.js(ワンナイト人狼)
  共通基盤: online-core.js(部屋・通信・QR・並べ替えUI。参考文献は各ファイル冒頭)
  オフライン版のゲーム一覧: ../games.js(ホストは、ルームを維持したまま、オフライン版のゲームを開ける)
  外部スクリプト: PeerJS(https://peerjs.com/)、qrcode-generator(https://github.com/kazuhikoarase/qrcode-generator)
-->
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../games.js"></script>
<script src="online-core.js"></script>
<script src="g-wolf.js"></script>
<script src="g-lupi.js"></script>
<script src="g-shimei.js"></script>
<script src="g-kankaku.js"></script>
<script src="g-gaman.js"></script>
<script src="g-chicken.js"></script>
<script src="g-indian.js"></script>
<script src="g-onenight.js"></script>
<script src="g-connect4.js"></script>
<script src="g-kosure.js"></script>
<script src="g-shake.js"></script>
<script>NomikaiOnline.startHub();</script>
<script src="../terms.js"></script>
</body>
</html>
